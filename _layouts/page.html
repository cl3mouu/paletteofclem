---
layout: default
---
<article class="wrap-narrow post is-article">
  <h1 class="post-title">{{ page.title }}</h1>
  {% if page.photo and page.photo != "" %}
    <img class="post-cover" src="{{ page.photo | relative_url }}" alt="">
  {% endif %}
  <div class="post-body">
    {{ content }}
  </div>
</article>
